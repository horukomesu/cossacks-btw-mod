[project]
name = "gsc-archive-manager"
version = "0.1.0"
description = "GUI tool to view/edit Cossacks resources.gsc archives"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PySide6==6.7.2",
  "Pillow==10.4.0",
  "rich==13.8.0",
]

[project.scripts]
gsc-archive-manager = "gsc_manager.__main__:main"


